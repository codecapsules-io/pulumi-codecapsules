[project]
  name = "pulumi_codecapsules"
  description = "A Pulumi provider for Code Capsules platform resources: teams, spaces, and capsules (MySQL, Redis, storage, WordPress)."
  dependencies = ["parver>=0.2.1", "pulumi>=3.165.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["codecapsules", "pulumi", "infrastructure-as-code"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.1.0"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://www.codecapsules.io"
    Repository = "https://github.com/codecapsules-io/pulumi-codecapsules"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_codecapsules = ["py.typed", "pulumi-plugin.json"]
